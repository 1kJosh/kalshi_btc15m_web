name: Validate Paper Bot Safety

on:
  push:
    branches: [safety/atomic-paper-reservations]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/bot_test
      MODE: paper
      ENABLE_LIVE: "false"
      LIVE_CONFIRM: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q bot.py app.py tests
      - name: Assert paper-only configuration
        run: |
          python - <<'PY'
          import os
          from bot import Config
          assert Config.from_env().mode == 'paper'
          os.environ['MODE'] = 'live'
          try:
              Config.from_env()
          except ValueError as exc:
              assert 'PAPER ONLY' in str(exc)
          else:
              raise AssertionError('Live mode must remain disabled')
          PY
      - name: Test PostgreSQL reservation safety
        run: python -m unittest discover -s tests -v
